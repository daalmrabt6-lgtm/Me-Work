<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعاء | معرض أعمال – مصممة وسائط إبداعية</title>
<meta name="description" content="معرض أعمال دعاء، طالبة وسائط إبداعية في تصميم الويب وتجربة المستخدم والتصميم الجرافيكي والتصوير وصناعة المحتوى الرقمي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===== 1) ألوان وخطوط الهوية (مأخوذة من الشعار): عدّلي القيم هنا فقط ===== */
:root{
  --navy:#0F3059; --navy-2:#173F72; --navy-d:#081E3B; --coral:#F85F57; --coral-d:#E04A42; --coral-s:#FFECE9;
  --white:#fff; --soft:#F5F7FB; --ink:#18233A; --muted:#58637A; --line:#E0E6F0;
  --font:'Readex Pro','Segoe UI',Tahoma,sans-serif; --body:'IBM Plex Sans Arabic','Readex Pro','Segoe UI',Tahoma,sans-serif;
  --r:22px; --wrap:1180px; --sh:0 30px 60px -28px rgba(15,48,89,.38);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:var(--white);line-height:1.95;font-size:17px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}a{color:inherit}
.wrap{width:min(var(--wrap),100% - 44px);margin-inline:auto}
section{padding:110px 0}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--font);line-height:1.3;font-weight:600;color:var(--navy)}
h2{font-size:clamp(30px,4.2vw,46px);margin-bottom:16px}
h2::before{content:"";display:block;width:46px;height:12px;margin-bottom:18px;
  background:radial-gradient(circle at 6px 6px,var(--coral) 5px,transparent 5.5px),radial-gradient(circle at 23px 6px,#7C8BA6 5px,transparent 5.5px),radial-gradient(circle at 40px 6px,var(--navy) 5px,transparent 5.5px)}
.lead{color:var(--muted);max-width:58ch;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 30px;border-radius:14px;border:2px solid var(--coral);
  background:var(--coral);color:#fff;font:500 16px var(--font);text-decoration:none;cursor:pointer;transition:background .25s,transform .25s,box-shadow .25s}
.btn:hover{background:var(--coral-d);border-color:var(--coral-d);transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(248,95,87,.7)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--navy)}
.btn.ghost:hover{background:var(--navy);color:#fff;box-shadow:none}
.btn.light{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn.light:hover{background:#fff;color:var(--navy);box-shadow:none}

header{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:74px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:700 22px var(--font);color:var(--navy)}
.brand img{height:46px;width:auto;border-radius:6px}
nav ul{display:flex;gap:4px;list-style:none}
nav a{display:block;padding:7px 16px;border-radius:12px;text-decoration:none;font-size:15px;color:var(--ink);transition:background .2s,color .2s}
nav a:hover{background:var(--soft);color:var(--navy)}
nav a.on{background:var(--navy);color:#fff}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer}
.burger span,.burger span::before,.burger span::after{display:block;width:24px;height:2px;background:var(--navy);position:relative;margin:auto;transition:.25s}
.burger span::before,.burger span::after{content:"";position:absolute;inset-inline-start:0}
.burger span::before{top:-7px}.burger span::after{top:7px}
.burger[aria-expanded=true] span{background:transparent}
.burger[aria-expanded=true] span::before{top:0;transform:rotate(45deg)}
.burger[aria-expanded=true] span::after{top:0;transform:rotate(-45deg)}

#home{padding:150px 0 110px;background:var(--navy);color:#fff;overflow:hidden;position:relative}
#home::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:var(--navy-2);inset-block-start:-180px;inset-inline-end:-140px}
#home::after{content:"";position:absolute;inset-inline:0;bottom:0;height:8px;background:var(--coral)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center;position:relative;z-index:1}
.hero .tag{display:inline-block;background:rgba(255,255,255,.1);border-radius:999px;padding:5px 18px;font-size:14px;margin-bottom:24px;color:#D5DEF0}
.hero h1{color:#fff;font-size:clamp(54px,9vw,112px);font-weight:700;line-height:1.05}
.hero h1 small{display:block;font:400 clamp(20px,2.6vw,30px) var(--font);color:var(--coral);margin-top:16px;line-height:1.5}
.hero p{margin:28px 0 36px;color:#DCE4F3;max-width:54ch;font-size:19px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:rise .9s cubic-bezier(.2,.7,.2,1) both;max-width:420px;justify-self:center;width:100%}
.hero-card .dots{background:#EEF2F8}
.hero-card .pad{padding:30px 30px 34px;display:grid;place-items:center}
.hero-card img{width:100%;max-width:300px;height:auto}
.hero-card .wordmark{font:700 100px var(--font);color:var(--navy)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

.about{display:grid;grid-template-columns:.85fr 1.15fr;gap:72px;align-items:center}
.me{position:relative;max-width:440px;justify-self:center;width:100%}
.me::before{content:"";position:absolute;inset:22px 22px -22px -22px;border:3px solid var(--coral);border-radius:var(--r)}
.me img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 28%;border-radius:var(--r);box-shadow:var(--sh)}
.about p{color:#33405A}.about p+p{margin-top:16px}
.facts{display:grid;gap:12px;margin-top:30px}
.fact{padding:16px 22px;background:var(--soft);border-radius:16px;border-inline-start:5px solid var(--coral)}
.fact b{display:block;color:var(--navy);font:600 16px var(--font)}.fact span{color:var(--muted);font-size:15px}

#work{background:var(--soft)}
.work-head{margin-bottom:40px}
.proj{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center;padding:56px 0;border-top:1px solid var(--line)}
.proj:nth-child(even){grid-template-columns:.75fr 1.25fr}.proj:nth-child(even) .shot{order:2}
.shot{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);cursor:pointer;display:block;width:100%;padding:0;font:inherit;transition:transform .4s,box-shadow .4s}
.shot:hover{transform:translateY(-6px);box-shadow:0 40px 70px -30px rgba(15,48,89,.5)}
.dots{display:flex;gap:7px;padding:11px 16px;background:#EEF2F8;direction:ltr}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--navy)}.dots i:first-child{background:var(--coral)}.dots i:nth-child(2){background:#7C8BA6}
.shot img{width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;object-position:top}
.win{overflow:hidden}
.cat{display:inline-block;background:var(--coral-s);color:var(--coral-d);font-weight:500;font-size:14px;padding:2px 14px;border-radius:999px;margin-bottom:12px}
.proj h3{font-size:clamp(28px,3.2vw,40px);margin-bottom:12px}
.proj .en{font-weight:300;color:var(--muted);font-size:.55em;margin-inline-start:10px}
.proj p{color:var(--muted);margin-bottom:26px}
.proj .acts{display:flex;gap:10px;flex-wrap:wrap}

.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.sk{border:1px solid var(--line);border-radius:var(--r);padding:34px;background:#fff;transition:transform .3s,box-shadow .3s}
.sk:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.sk:nth-child(2){background:var(--navy);color:#fff;border-color:var(--navy)}.sk:nth-child(2) h3{color:#fff}
.sk h3{font-size:22px;margin-bottom:20px;padding-bottom:12px;border-bottom:3px solid var(--coral);display:inline-block}
.sk ul{list-style:none;display:flex;flex-wrap:wrap;gap:10px}
.sk li{padding:6px 16px;border-radius:12px;background:var(--soft);color:var(--ink);font-size:15px}
.sk:nth-child(2) li{background:rgba(255,255,255,.12);color:#fff}

#journey{background:var(--navy);color:#fff}#journey h2{color:#fff}#journey .lead{color:#C9D4EA}
.steps{list-style:none;margin-top:52px;display:grid;grid-template-columns:repeat(6,1fr);counter-reset:s}
.steps li{position:relative;padding-top:48px;padding-inline-end:16px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;top:0;inset-inline-start:0;width:36px;height:36px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font:600 15px var(--font)}
.steps li::after{content:"";position:absolute;top:17px;inset-inline-start:46px;inset-inline-end:8px;height:2px;background:rgba(255,255,255,.2)}
.steps li:last-child::after{display:none}
.steps b{display:block;font:600 18px var(--font);margin-bottom:4px}.steps span{color:#C9D4EA;font-size:15px;line-height:1.7;display:block}
.note{margin-top:52px;padding:28px 32px;border-radius:var(--r);background:rgba(255,255,255,.08);border-inline-start:5px solid var(--coral);max-width:70ch}

.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px}
form{display:grid;gap:16px;background:var(--soft);padding:34px;border-radius:var(--r)}
label{font:500 15px var(--font);color:var(--navy);display:block;margin-bottom:4px}
input,textarea{width:100%;font:inherit;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px rgba(248,95,87,.15)}
textarea{min-height:150px;resize:vertical}
#email{direction:ltr;text-align:right}
.msg{min-height:1.6em;font-size:15px;color:var(--navy)}.msg.err{color:var(--coral-d)}
.social{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.social a{padding:8px 20px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;font-size:15px;transition:.2s}
.social a:hover{border-color:var(--coral);color:var(--coral-d)}
footer{background:var(--navy-d);color:#B8C5DE;text-align:center;padding:30px 0;font-size:14px}

dialog{border:0;border-radius:24px;width:min(940px,100% - 24px);max-height:92vh;padding:0;overflow:auto;color:var(--ink);margin:auto}
dialog::backdrop{background:rgba(8,30,59,.75)}
.cs{padding:0 0 36px}
.cs .top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.cs .top .cat{margin:0}
.x{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:22px;cursor:pointer;color:var(--navy)}.x:hover{background:var(--navy);color:#fff}
.cs .body{padding:28px 32px 0}
.cs .shot{cursor:default;margin-bottom:30px}.cs .shot:hover{transform:none}.cs .shot img{aspect-ratio:auto;height:auto;object-fit:contain}
.cs h2{font-size:clamp(26px,4vw,38px)}.cs h2::before{display:none}
.cs dl{display:grid;grid-template-columns:160px 1fr;gap:18px 24px;margin:26px 0 32px}
.cs dt{font:600 16px var(--font);color:var(--navy)}.cs dd{color:var(--muted)}.cs dd ul{padding-inline-start:20px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools span{background:var(--soft);padding:2px 14px;border-radius:10px;font-size:14px;color:var(--ink)}

@media (max-width:980px){
  .hero,.about,.contact,.proj,.proj:nth-child(even){grid-template-columns:1fr}
  .proj:nth-child(even) .shot{order:0}
  .about{gap:48px}.skills{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr 1fr;row-gap:32px}.steps li::after{display:none}
}
@media (max-width:820px){
  .burger{display:block}
  nav{position:fixed;inset:74px 0 auto 0;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px 20px;display:none;margin-top:env(safe-area-inset-top,0px)}
  nav.open{display:block}nav ul{flex-direction:column}nav a{padding:13px 14px;font-size:17px}
}
@media (max-width:560px){
  section{padding:72px 0}body{font-size:16px}#home{padding:120px 0 80px}
  .steps{grid-template-columns:1fr}.cs dl{grid-template-columns:1fr;gap:4px}.cs dd{margin-bottom:14px}.cs .body{padding:20px 18px 0}
  form{padding:22px}.me::before{inset:14px 14px -14px -14px}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#home" id="brand"></a>
    <button class="burger" id="burger" aria-label="القائمة" aria-expanded="false" aria-controls="nav"><span></span></button>
    <nav id="nav" aria-label="التنقل الرئيسي"><ul id="menu"></ul></nav>
  </div>
</header>

<main>
<section id="home">
  <div class="wrap hero">
    <div>
      <span class="tag" id="h-tag"></span>
      <h1 id="h-name"></h1>
      <p id="h-intro"></p>
      <div class="acts">
        <a class="btn" href="#work" id="h-cta"></a>
        <a class="btn light" href="#contact" id="h-cta2"></a>
      </div>
    </div>
    <div class="hero-card"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="pad" id="h-logo"></div></div>
  </div>
</section>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// الشعار والاسم
const logoHTML = () => SITE.logoFull ? `<img src="${esc(SITE.logoFull)}" alt="شعار ${esc(SITE.name)}">` : `<span class="wordmark">${esc(SITE.name.charAt(0))}</span>`;
$('brand').innerHTML = (SITE.logo ? `<img src="${esc(SITE.logo)}" alt="">` : '') + `<span>${esc(SITE.name)}</span>`;
$('h-logo').innerHTML = logoHTML();
$('h-tag').textContent = SITE.title;
$('h-name').innerHTML = `${esc(SITE.name)}<small>${esc(SITE.title)}</small>`;
$('h-intro').textContent = SITE.intro;
$('h-cta').textContent = "استكشف أعمالي";
$('h-cta2').textContent = "تواصل معي";
document.title = `${SITE.name} | معرض أعمال – ${SITE.title}`;

// القائمة
$('menu').innerHTML = SITE.nav.map(([id,t]) => `<li><a href="#${id}" data-s="${id}">${esc(t)}</a></li>`).join('');

// من أنا
$('a-title').textContent = SITE.about.title;
$('a-text').innerHTML = SITE.about.paras.map(p => `<p>${esc(p)}</p>`).join('');
$('a-facts').innerHTML = SITE.about.facts.map(([a,b]) => `<div class="fact"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('');

// المعرض
$('w-title').textContent = SITE.work.title;
$('w-lead').textContent = SITE.work.lead;
const frame = p => `<div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="win"><img src="${p.image}" alt="الصفحة الرئيسية لمشروع ${esc(p.title)}" loading="lazy" width="1200" height="600"></div>`;
$('projects').innerHTML = PROJECTS.map(p => `
  <article class="proj">
    <button class="shot" data-open="${p.id}" aria-label="قراءة دراسة حالة ${esc(p.title)}">${frame(p)}</button>
    <div>
      <span class="cat">${esc(p.category)}</span>
      <h3>${esc(p.title)}${p.en ? `<span class="en" dir="ltr">${esc(p.en)}</span>` : ''}</h3>
      <p>${esc(p.summary)}</p>
      <div class="acts">
        <button class="btn ghost" data-open="${p.id}">دراسة الحالة</button>
        <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">زيارة الموقع</a>
      </div>
    </div>
  </article>`).join('');

// المهارات
$('s-title').textContent = SITE.skillsTitle;
$('s-lead').textContent = SITE.skillsLead;
$('s-grid').innerHTML = SITE.skills.map(([t,l]) => `<div class="sk"><h3>${esc(t)}</h3><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');

// الرحلة
$('j-title').textContent = SITE.journey.title;
$('j-lead').textContent = SITE.journey.lead;
$('j-steps').innerHTML = SITE.journey.steps.map(([a,b]) => `<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('');
$('j-note').textContent = SITE.journey.note;

// التواصل
$('c-title').textContent = SITE.contact.title;
$('c-lead').textContent = SITE.contact.lead;
$('c-social').innerHTML = SITE.social.length
  ? SITE.social.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('')
  : '';
$('foot').textContent = SITE.footer;

// دراسة الحالة
const dlg = $('dlg');
function openCase(id){
  const p = PROJECTS.find(x => x.id === id); if(!p) return;
  $('cs').innerHTML = `
    <div class="top"><span class="cat" style="margin:0">${esc(p.category)}</span><button class="x" id="close" aria-label="إغلاق">×</button></div>
    <div class="body">
      <div class="shot">${frame(p)}</div>
      <h2 id="cs-title">${esc(p.title)}${p.en ? ` <span dir="ltr" style="font-weight:300;color:var(--muted)">${esc(p.en)}</span>` : ''}</h2>
      <dl>
        <dt>نظرة عامة</dt><dd>${esc(p.overview)}</dd>
        <dt>الهدف من المشروع</dt><dd>${esc(p.purpose)}</dd>
        <dt>دوري</dt><dd>${esc(p.role)}</dd>
        <dt>ما يظهر في الواجهة</dt><dd><ul>${p.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></dd>
        <dt>مراحل العمل</dt><dd>بحث وتخطيط، ثم تصميم الواجهة، ثم البناء والنشر، ثم المراجعة والتحسين.</dd>
        <dt>الأدوات</dt><dd><div class="tools" dir="ltr">${p.tools.map(t=>`<span>${esc(t)}</span>`).join('')}</div></dd>
      </dl>
      <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">زيارة الموقع المنشور</a>
    </div>`;
  dlg.showModal();
  $('close').onclick = () => dlg.close();
  history.replaceState(null,'','#'+id);
}
document.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if(b) openCase(b.dataset.open); });
dlg.addEventListener('click', e => { if(e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => history.replaceState(null,'','#work'));
if (PROJECTS.some(p => '#'+p.id === location.hash)) openCase(location.hash.slice(1));

// قائمة الجوال
const burger = $('burger'), nav = $('nav');
burger.onclick = () => { const o = nav.classList.toggle('open'); burger.setAttribute('aria-expanded', o); };
nav.addEventListener('click', e => { if(e.target.tagName === 'A'){ nav.classList.remove('open'); burger.setAttribute('aria-expanded', false); } });

// تمييز القسم الحالي
const links = [...document.querySelectorAll('nav a')];
const io = new IntersectionObserver(es => es.forEach(en => {
  if(en.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.s === en.target.id));
}), { rootMargin:'-45% 0px -50% 0px' });
SITE.nav.forEach(([id]) => { const el = $(id); if(el) io.observe(el); });

// نموذج التواصل
if(!SITE.formAction && !SITE.email){
  $('form').querySelector('button').disabled = true;
  $('msg').textContent = 'نموذج الرسائل غير مفعّل حاليًا. سيعمل بعد إضافة بريد أو خدمة استقبال في إعدادات الموقع.';
}
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim(), message = $('message').value.trim(), out = $('msg');
  out.className = 'msg';
  if(!/^\S+@\S+\.\S+$/.test(email)){ out.className='msg err'; out.textContent='أدخل بريدًا إلكترونيًا صحيحًا.'; $('email').focus(); return; }
  if(message.length < 5){ out.className='msg err'; out.textContent='اكتب رسالتك قبل الإرسال.'; $('message').focus(); return; }
  if(SITE.formAction){
    try{
      const r = await fetch(SITE.formAction,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email,message})});
      if(!r.ok) throw 0;
      out.textContent='تم إرسال رسالتك. شكرًا لتواصلك.'; e.target.reset();
    }catch{ out.className='msg err'; out.textContent='تعذّر الإرسال. حاول مرة أخرى لاحقًا.'; }
  } else if(SITE.email){
    location.href = `mailto:${SITE.email}?subject=${encodeURIComponent('رسالة من الموقع')}&body=${encodeURIComponent(message+'\n\n'+email)}`;
    out.textContent='تم فتح تطبيق البريد لإرسال رسالتك.';
  } else {
    out.className='msg err'; out.textContent='الإرسال غير مفعّل بعد: أضيفي بريدك أو رابط النموذج في إعدادات الموقع.';
  }
});
</script>
</body>
</html>
